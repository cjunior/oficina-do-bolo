spring.application.name=demo

# Respect X-Forwarded-* from the deploy-service reverse proxy so springdoc /
# Swagger UI emit correct URLs when served under a /app/<id> sub-path.
server.forward-headers-strategy=framework

spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# As colunas e tabelas ja sao geradas em snake_case, iguais as das migrations.
# Com a estrategia padrao os nomes explicitos de @Table/@Column/@JoinColumn valem
# exatamente como escritos, entao a validacao do schema nunca depende de reescrita.
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_JWKS_URL:http://localhost:8080/realms/pdc-generated/protocol/openid-connect/certs}
