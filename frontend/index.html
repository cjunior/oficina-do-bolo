<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loja de Bolos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("theme") || "light" || "light";
          document.documentElement.setAttribute("data-theme", t);
          document.documentElement.dataset.theme = t;
          document.documentElement.setAttribute("data-bs-theme", t);
          document.documentElement.setAttribute("data-swal2-theme", t);
        } catch (e) {}
      })();
    </script>
    <script src="./config.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
